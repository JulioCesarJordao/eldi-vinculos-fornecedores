services:
  - type: web
    name: eldi-vinculos-mvp
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    healthCheckPath: /entrar/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ELDI_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eldi-vinculos-db
          property: connectionString
databases:
  - name: eldi-vinculos-db
    plan: free
    region: virginia
    databaseName: eldi
    user: eldi
